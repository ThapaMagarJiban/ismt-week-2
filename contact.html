<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISMT Week 2 – Contact</title>
    <style>
      /* Critical styles inlined to avoid render-blocking external stylesheets */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: system-ui, sans-serif; line-height: 1.6; color: #333; background: #f9f9f9; }
      header { background: #0057a8; color: #fff; padding: 1rem 2rem; }
      header h1 { font-size: 1.5rem; }
      nav { display: flex; gap: 1rem; margin-top: 0.5rem; }
      nav a { color: #cce0ff; text-decoration: none; font-size: 0.95rem; }
      nav a:hover, nav a[aria-current="page"] { color: #fff; text-decoration: underline; }
      main { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
      h2 { margin-bottom: 0.75rem; font-size: 1.25rem; }
      label { display: block; margin-bottom: 0.25rem; font-weight: 600; }
      input, textarea { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font: inherit; margin-bottom: 1rem; }
      textarea { resize: vertical; min-height: 120px; }
      button { background: #0057a8; color: #fff; border: none; padding: 0.6rem 1.4rem; border-radius: 4px; cursor: pointer; font-size: 1rem; }
      button:hover { background: #00408a; }
      footer { text-align: center; padding: 1rem; font-size: 0.85rem; color: #666; border-top: 1px solid #ddd; margin-top: 2rem; }
    </style>
  </head>
  <body>
    <header>
      <h1>ISMT Week 2</h1>
      <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </header>

    <main>
      <h2>Contact Us</h2>
      <form action="#" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" autocomplete="name" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required />

        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </main>

    <footer>
      <p>&copy; 2024 ISMT Week 2</p>
    </footer>
  </body>
</html>
